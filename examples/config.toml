# ShuVoice example configuration (Rust app)
#
# Copy keys you need into ~/.config/shuvoice/config.toml, or start from the wizard:
#   shuvoice wizard
# Inspect / validate:
#   shuvoice config effective
#   shuvoice config validate
#
# Schema ownership: crates/shuvoice-core (config_version = 1).
# Optional heavy ASR/TTS engines (NeMo, Moonshine, MeloTTS) run as isolated
# Python workers via worker-proto — not as an in-process Python application module.

config_version = 1

[audio]
sample_rate = 16000
chunk_ms = 100
fallback_sample_rate = 48000
# Optional explicit input device name/index (see: shuvoice audio list-devices)
# audio_device = 2
# Optional mic gain multiplier (eg. 1.5 if too quiet)
input_gain = 1.0
# Max queued chunks before dropping oldest (bounded queue for lower latency)
audio_queue_max_size = 200
# Audio retained around push-to-talk start to catch very short prompts
recording_preroll_ms = 200
# Absolute RMS floor used to suppress silence hallucinations on empty presses
silence_rms_threshold = 0.008
# Dynamic speech threshold multiplier based on ambient noise floor
silence_rms_multiplier = 1.8
# Minimum above-threshold speech to consider an utterance valid
min_speech_ms = 80
# App-side per-utterance auto-gain (used by backends that do not request raw audio,
# currently Sherpa). NeMo and Moonshine workers bypass this gain path.
auto_gain_target_peak = 0.15
auto_gain_max = 10.0
auto_gain_settle_chunks = 2

[asr]
# sherpa | nemo | moonshine | openai_realtime
#   sherpa           — native static sherpa-onnx in-process (CPU only)
#   openai_realtime  — native cloud client (API key via env / local.dev)
#   nemo | moonshine — optional Python workers (setup + workers tree + venv)
asr_backend = "sherpa"
# Optional low-latency profile. When true, ShuVoice applies backend-specific
# fast-path tuning (for moonshine this forces moonshine/tiny + tighter decode window).
# instant_mode = false

# --- NeMo worker settings (used when asr_backend = "nemo") ---
# Requires a discoverable workers tree (see workers/README.md) and
# ~/.local/share/shuvoice/workers-nemo-venv/ (or setup-created equivalent).
# Bootstrap: shuvoice setup --asr-backend nemo
# model_name = "nvidia/nemotron-speech-streaming-en-0.6b"
# right_context = 13                 # NeMo-only; typical values: 0 | 1 | 6 | 13
# device = "cuda"                    # worker-side device string: cuda | cpu
# use_cuda_graph_decoder = false     # keep false unless verified stable on your stack

# --- Sherpa settings (used when asr_backend = "sherpa") ---
# Native static build is CPU-only. sherpa_provider = "cuda" fails closed at
# setup/preflight/load (no Python wheel install, no CUDA provider fallback).
# sherpa_model_name = "sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06"
# sherpa_decode_mode = "auto"  # auto | streaming | offline_instant
# For Parakeet TDT v3 via Sherpa release assets (stable/default path):
# sherpa_model_name = "sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
# instant_mode = true
# sherpa_decode_mode = "offline_instant"
#
# Optional Parakeet streaming override:
# sherpa_decode_mode = "streaming"
# sherpa_enable_parakeet_streaming = true
# sherpa_model_dir = "/path/to/sherpa-model"  # optional; auto-downloads selected sherpa_model_name when unset
# sherpa_provider = "cpu"   # only "cpu" is supported; "cuda" is rejected
# sherpa_num_threads = 2
# sherpa_chunk_ms = 100       # streaming mode only; ignored for offline_instant
# sherpa_offline_max_utterance_sec = 60.0

# --- Moonshine worker settings (used when asr_backend = "moonshine") ---
# Requires workers tree + ~/.local/share/shuvoice/workers-moonshine-venv/
# Bootstrap: shuvoice setup --asr-backend moonshine
# moonshine_model_name = "moonshine/tiny"         # moonshine/tiny (fast) or moonshine/base
# moonshine_model_dir = "/path/to/local/moonshine-model"   # optional
# moonshine_model_precision = "float"
# moonshine_chunk_ms = 100
# moonshine_max_window_sec = 5.0
# moonshine_max_tokens = 64
# moonshine_provider = "cpu"                       # worker-side: cpu | cuda
# moonshine_onnx_threads = 0                       # 0 = auto; set explicitly to tune CPU parallelism

# --- OpenAI Realtime (native; used when asr_backend = "openai_realtime") ---
# API keys are env-only. Put this in ~/.config/shuvoice/local.dev:
# export OPENAI_API_KEY=sk-...
# openai_realtime_model = "gpt-4o-transcribe"
# openai_realtime_api_key_env = "OPENAI_API_KEY"
# openai_realtime_language = "en"
# openai_realtime_turn_detection = "manual"         # v1 supports manual only
# openai_realtime_vad_eagerness = "auto"            # reserved for future semantic_vad support
# openai_realtime_request_timeout_sec = 10.0
# openai_realtime_commit_timeout_sec = 5.0

[overlay]
font_size = 22
# Optional per-overlay font family (app-only, does not change system/global GTK fonts)
# Allowed characters: letters, numbers, spaces, '.', '_' and '-'
# font_family = "JetBrains Mono"
bg_opacity = 0.75
border_radius = 16
bottom_margin = 60
# Debug overlay adds live runtime stats + recent logs under the main caption overlay.
# overlay_debug_mode = false
# overlay_debug_max_lines = 12

[control]
# Optional control socket override (defaults to "$XDG_RUNTIME_DIR/shuvoice/control.sock")
# control_socket = "/path/to/control.sock"

[tts]
# true | false
# tts_enabled = true
# elevenlabs | openai | local | melotts | kokoro
# tts_backend = "elevenlabs"
# ElevenLabs defaults
# tts_default_voice_id = "zNsotODqUhvbJ5wMG7Ei"
# tts_model_id = "eleven_flash_v2_5"
# tts_api_key_env = "ELEVENLABS_API_KEY"
# OpenAI defaults (auto-applied when tts_backend = "openai" and the ElevenLabs defaults are unchanged)
# tts_default_voice_id = "onyx"
# tts_model_id = "gpt-4o-mini-tts"
# tts_api_key_env = "OPENAI_API_KEY"
# Raw PCM playback format used by the current TTS backends
# tts_output_format = "pcm_24000"
# tts_max_chars = 5000
# tts_request_timeout_sec = 30.0
# Default synthesis speed (runtime overlay controls can adjust this between 0.5x and 2.0x).
# Changing speed while speaking restarts the current utterance from the beginning.
# tts_playback_speed = 1.0
# Optional output device name/index for TTS playback
# tts_playback_device = 3
# tts_overlay_auto_hide_sec = 2.0
# Local Piper backend (tts_backend = "local")
# Default local voice auto-resolves to the first discovered .onnx model unless you set one explicitly.
# Wizard/setup automation uses ~/.local/share/shuvoice/models/piper by default.
# tts_default_voice_id = "default"
# tts_model_id = "piper"
# tts_local_model_path = "~/.local/share/shuvoice/models/piper"   # file or directory also accepted in manual mode
# tts_local_voice = "en_US-amy-medium"
# tts_local_device = 3
# MeloTTS (optional Python worker via worker-proto; requires CLI feature tts-worker)
# tts_backend = "melotts"
# tts_default_voice_id = "EN-US"
# tts_model_id = "melotts"
# tts_melotts_device = "auto"   # auto | cpu | cuda
# tts_melotts_venv_path = "~/.local/share/shuvoice/melotts-venv"
# Kokoro (local self-hosted, OpenAI-compatible) — tts_backend = "kokoro"
# tts_backend = "kokoro"
# tts_default_voice_id = "af_heart"
# tts_model_id = "kokoro"
# tts_kokoro_base_url = "http://localhost:8880/v1"

[typing]
# final_only | streaming_partial
output_mode = "final_only"
# auto | clipboard | direct. Auto avoids clipboard pollution when Omarchy/Elephant is detected.
typing_final_injection_mode = "auto"
# default | lowercase. Lowercase mode is useful for informal chat/conversation.
typing_text_case = "default"
typing_clipboard_settle_delay_ms = 40
# use_clipboard_for_final is soft-deprecated in favor of typing_final_injection_mode
use_clipboard_for_final = true
preserve_clipboard = false
typing_retry_attempts = 2
typing_retry_delay_ms = 40
auto_capitalize = true
# Optional word/phrase corrections applied to final text before typing.
# Case-insensitive, whole-word/phrase matches. Use empty value to delete a word.
# Built-in defaults already normalize common ShuVoice/Hyprland variants
# (e.g. "shove voice", "shu voice", "show voice", "hyper land", "high per land").
# Add your own entries (or override built-ins) below.
# [typing.text_replacements]
# "speech to text" = "speech-to-text"
# "um" = ""

[streaming]
# Stall guard injects a short silent flush when transcript stalls despite speech energy.
streaming_stall_guard = true
streaming_stall_chunks = 4
streaming_stall_rms_ratio = 0.7
streaming_stall_flush_chunks = 1

[feedback]
audio_feedback = true
feedback_start_freq = 880
feedback_stop_freq = 660
feedback_duration_ms = 70
feedback_volume = 0.08
