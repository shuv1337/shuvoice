# ShuVoice example: NeMo ASR via optional Python worker (CPU)
#
# NeMo does NOT run inside the Rust app process. The desktop binary spawns
# `python -m nemo_asr` from a discoverable workers tree over worker-proto.
#
# Prerequisites:
#   - workers tree with shuvoice_worker_proto/ + nemo_asr/
#     (dev: repo workers/; packaged: /usr/lib/shuvoice/workers or SHUVOICE_WORKERS_DIR)
#   - venv at ~/.local/share/shuvoice/workers-nemo-venv/
# Bootstrap: shuvoice setup --asr-backend nemo
# Validate:  shuvoice config validate && shuvoice preflight
#
# CPU is a high-latency fallback; prefer config-nemo-cuda.toml when the worker
# host has a working CUDA torch stack.

config_version = 1

[audio]
sample_rate = 16000
chunk_ms = 100
fallback_sample_rate = 48000
input_gain = 1.8
silence_rms_threshold = 0.008
silence_rms_multiplier = 1.8
min_speech_ms = 80

[asr]
asr_backend = "nemo"
model_name = "nvidia/nemotron-speech-streaming-en-0.6b"
right_context = 6
# Worker-side device string (not an in-process Rust/CUDA provider).
device = "cpu"
use_cuda_graph_decoder = false

[control]
# Defaults to "$XDG_RUNTIME_DIR/shuvoice/control.sock" when unset.
# control_socket = "/path/to/control.sock"

[typing]
output_mode = "final_only"
typing_final_injection_mode = "auto"
use_clipboard_for_final = true
