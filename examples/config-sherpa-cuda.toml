# ShuVoice DIAGNOSTIC fixture: Sherpa + sherpa_provider = "cuda"
#
# INTENTIONAL FAIL-CLOSED EXAMPLE — do not use as a working profile.
#
# The Rust desktop binary links a static CPU-only sherpa-onnx build.
# Config parse accepts the key (schema allows "cpu" | "cuda"), but
# setup / preflight / ASR load reject cuda with an actionable error and
# exit guidance to set sherpa_provider = "cpu". There is no Python wheel
# install path and no runtime CUDA→CPU fallback for native Sherpa.
#
# Supported Sherpa profile: examples/config-sherpa-cpu.toml
# Expected outcome when selected at runtime: fail closed (often exit 78).

config_version = 1

[audio]
sample_rate = 16000
chunk_ms = 100
fallback_sample_rate = 48000
input_gain = 1.0
audio_queue_max_size = 200
recording_preroll_ms = 200
silence_rms_threshold = 0.006
silence_rms_multiplier = 1.3
min_speech_ms = 80
auto_gain_target_peak = 0.15
auto_gain_max = 10.0
auto_gain_settle_chunks = 2

[asr]
asr_backend = "sherpa"
# Optional local model directory. If unset, ShuVoice auto-downloads sherpa_model_name.
# sherpa_model_dir = "/path/to/sherpa-model-dir"
sherpa_provider = "cuda"
sherpa_num_threads = 2
sherpa_chunk_ms = 100

[control]
# Defaults to "$XDG_RUNTIME_DIR/shuvoice/control.sock" when unset.
# control_socket = "/path/to/control.sock"

[typing]
output_mode = "final_only"
typing_final_injection_mode = "auto"
use_clipboard_for_final = true
