name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run optional local smoke script (no service/mic/display)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            clang \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libwayland-dev

      # Pin to workspace package.rust-version (Cargo.toml), not floating stable.
      - name: Install Rust toolchain (MSRV 1.92)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shuvoice-desktop-1.92

      - name: Format (workspace)
        run: cargo fmt --all -- --check

      - name: Check workspace (default features)
        run: cargo check --locked --workspace --all-targets

      - name: Check CLI (no default features)
        run: cargo check --locked -p shuvoice-cli --no-default-features --all-targets

      - name: Check CLI (desktop / default features)
        run: cargo check --locked -p shuvoice-cli --features desktop --all-targets

      - name: Check CLI (all features)
        run: cargo check --locked -p shuvoice-cli --all-features --all-targets

      - name: Test workspace (default features)
        run: cargo test --locked --workspace --all-targets -- --nocapture

      - name: Test CLI (no default features)
        run: cargo test --locked -p shuvoice-cli --no-default-features --all-targets -- --nocapture

      - name: Test CLI (desktop / default features)
        run: cargo test --locked -p shuvoice-cli --features desktop --all-targets -- --nocapture

      - name: Test CLI (all features)
        run: cargo test --locked -p shuvoice-cli --all-features --all-targets -- --nocapture

      - name: Clippy workspace (default features)
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings

      - name: Clippy CLI (no default features)
        run: cargo clippy --locked -p shuvoice-cli --no-default-features --all-targets --no-deps -- -D warnings

      - name: Clippy CLI (desktop / default features)
        run: cargo clippy --locked -p shuvoice-cli --features desktop --all-targets --no-deps -- -D warnings

      - name: Clippy CLI (all features)
        run: cargo clippy --locked -p shuvoice-cli --all-features --all-targets --no-deps -- -D warnings

      - name: Packaging unit contract
        run: cargo test --locked -p shuvoice-cli --features desktop --test packaging_unit -- --nocapture

  workers:
    name: Python workers (stdlib unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Worker protocol + fake-engine tests
        working-directory: workers
        run: python -m unittest discover -s tests -v

  smoke:
    name: Optional smoke (no live service/mic)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_smoke == 'true' }}
    needs: [rust, workers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            clang \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libwayland-dev

      - name: Install Rust toolchain (MSRV 1.92)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shuvoice-desktop-1.92

      - name: Build debug CLI (desktop)
        run: cargo build --locked -p shuvoice-cli --features desktop --bins

      - name: Run smoke script
        run: ./scripts/smoke-test.sh
