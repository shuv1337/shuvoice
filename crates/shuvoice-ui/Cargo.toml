[package]
name = "shuvoice-ui"
description = "Headless UI models and optional GTK4 layer-shell surfaces for ShuVoice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gtk = [
    "dep:cairo-rs",
    "dep:gdk4",
    "dep:gio",
    "dep:glib",
    "dep:gtk4",
    "dep:gtk4-layer-shell",
]

[dependencies]
cairo-rs = { version = "0.22", optional = true, default-features = false, features = ["use_glib"] }
gdk4 = { workspace = true, optional = true }
gio = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
gtk4-layer-shell = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
shuvoice-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
