[workspace]
resolver = "2"
members = [
    "crates/shuvoice-app",
    "crates/shuvoice-asr",
    "crates/shuvoice-cli",
    "crates/shuvoice-control",
    "crates/shuvoice-core",
    "crates/shuvoice-io",
    "crates/shuvoice-tts",
    "crates/shuvoice-ui",
    "crates/shuvoice-worker-proto",
]
default-members = ["crates/shuvoice-cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/shuv1337/shuvoice"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bzip2 = "0.6"
bytes = "1.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
cpal = { version = "0.18", features = ["pipewire"] }
futures-util = "0.3"
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
libc = "0.2"
once_cell = "1.21"
parking_lot = "0.12"
rand = "0.10"
rand_distr = "0.6"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls",
    "stream",
    "system-proxy",
] }
rustix = { version = "1.1", features = ["fs", "process", "runtime", "thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["static"] }
symphonia = { version = "0.5", features = ["mp3", "pcm"] }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
    "url",
] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
url = "2.5"
uuid = { version = "1.22", features = ["serde", "v7"] }
which = "8.0"

assert_cmd = "2.1"
httpmock = "0.8"
insta = { version = "1.46", features = ["json", "redactions"] }
predicates = "3.1"
proptest = "1.10"
rstest = "0.26"
serial_test = "3.4"
tempfile = "3.27"

shuvoice-app = { path = "crates/shuvoice-app" }
shuvoice-asr = { path = "crates/shuvoice-asr" }
shuvoice-control = { path = "crates/shuvoice-control" }
shuvoice-core = { path = "crates/shuvoice-core" }
shuvoice-io = { path = "crates/shuvoice-io" }
shuvoice-tts = { path = "crates/shuvoice-tts" }
shuvoice-ui = { path = "crates/shuvoice-ui" }
shuvoice-worker-proto = { path = "crates/shuvoice-worker-proto" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
